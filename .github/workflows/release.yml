name: Release addon

on:
  push:
    branches:
      - main
    tags:
      - "**"

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # db.lua is gitignored (desktop writes live raid data there). The TOC still
      # lists it, so the CurseForge zip needs the empty shell from defaults.lua.
      - name: Seed empty db.lua for TOC
        run: |
          cp Data/defaults.lua Data/db.lua
          git add -f Data/db.lua

      - uses: BigWigsMods/packager@v2
        with:
          pkgmeta: .pkgmeta
